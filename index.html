    <title>YAi Translator</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было белой вспышки.
      try {
        var savedTheme = JSON.parse(localStorage.getItem('yai.theme') || '"system"');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (savedTheme === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        /* приватный режим — остаётся светлая тема */
      }
    </script>

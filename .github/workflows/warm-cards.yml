name: Warm Word Cards

on:
  schedule:
    # Каждые 2 часа в 17 минут, 2 захода (1.0.1): раньше 3 запуска в сутки по ~8 слов — очередь шла бы годами.
    # Больше не ставить: прогрев тратит те же бесплатные ключи Gemini/Groq, что и пользователи.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      batchSize:
        description: 'Количество слов для прогрева (по умолчанию 40)'
        required: false
        default: '40'

jobs:
  warm:
    name: Warm popular cards
    runs-on: ubuntu-latest
    steps:
      - name: Trigger warming endpoint
        run: |
          BATCH_SIZE="${{ github.event.inputs.batchSize || '25' }}"
          # 2 захода подряд (~8 минут): один неудачный заход не останавливает остальные.
          for round in 1 2; do
            echo "Заход $round: прогрев до $BATCH_SIZE карточек..."
            curl -s -S --max-time 280 -X POST "https://yai-translator.pages.dev/api/admin/warm" \
              -H "Authorization: Bearer ${{ secrets.WARM_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"batchSize\": $BATCH_SIZE}" || echo "Заход $round не удался"
            echo
          done

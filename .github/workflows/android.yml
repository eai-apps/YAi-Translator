name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App & TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Capacitor 8 needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android & sync Capacitor
        run: npm run build:android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check signing secrets availability
        id: check_secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      # 1. Ветка сборки Release с цифровой подписью (если секреты добавлены)
      - name: Build Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Signed Release File
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cp ${{ steps.sign_app.outputs.signedReleaseFile }} YAi-Translator-${{ env.APP_VERSION }}.apk

      - name: Upload Release APK to GitHub Release
        if: steps.check_secrets.outputs.has_secrets == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: YAi-Translator-${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed APK as Workflow Artifact
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YAi-Translator-${{ env.APP_VERSION }}-release
          path: YAi-Translator-${{ env.APP_VERSION }}.apk

      # 2. Ветка сборки отладочного APK (если секреты ещё не заданы)
      - name: Build Debug APK
        if: steps.check_secrets.outputs.has_secrets == 'false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../YAi-Translator-${{ env.APP_VERSION }}-debug.apk

      - name: Upload Debug APK as Workflow Artifact
        if: steps.check_secrets.outputs.has_secrets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: YAi-Translator-${{ env.APP_VERSION }}-debug
          path: YAi-Translator-${{ env.APP_VERSION }}-debug.apk

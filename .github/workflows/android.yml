name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android App & TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Capacitor 8 needs Node 22+)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android & sync Capacitor
        run: npm run build:android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check signing secrets availability
        id: check_secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      # 1. Ветка сборки Release с цифровой подписью (если секреты добавлены)
      - name: Build signed Release APK
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          YAI_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          YAI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YAI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YAI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$YAI_KEYSTORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk YAi-Translator-${{ env.APP_VERSION }}.apk
          # Постоянное имя: ссылка releases/latest/download/YAi-Translator.apk всегда ведёт на свежий APK.
          cp android/app/build/outputs/apk/release/app-release.apk YAi-Translator.apk
          rm -f "$YAI_KEYSTORE_FILE"

      - name: Upload Release APK to GitHub Release
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Тег создаётся сам и при запуске кнопкой «Run workflow» (вкладка Actions).
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            YAi-Translator-${{ env.APP_VERSION }}.apk
            YAi-Translator.apk
          name: YAi Translator ${{ env.APP_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed APK as Workflow Artifact
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YAi-Translator-${{ env.APP_VERSION }}-release
          path: YAi-Translator-${{ env.APP_VERSION }}.apk

      # 2. Ветка сборки отладочного APK (если секреты ещё не заданы)
      - name: Build Debug APK
        if: steps.check_secrets.outputs.has_secrets == 'false'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../YAi-Translator-${{ env.APP_VERSION }}-debug.apk

      - name: Upload Debug APK as Workflow Artifact
        if: steps.check_secrets.outputs.has_secrets == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: YAi-Translator-${{ env.APP_VERSION }}-debug
          path: YAi-Translator-${{ env.APP_VERSION }}-debug.apk

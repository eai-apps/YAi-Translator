<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAi Translator</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0e1117;color:#e8ebf2;font-family:system-ui,-apple-system,Roboto,sans-serif;text-align:center}
  .box{padding:24px;max-width:340px}
  img{width:84px;height:84px;border-radius:20px}
  h1{font-size:20px;margin:18px 0 8px}
  p{color:#9aa3b5;font-size:15px;line-height:1.45;margin:0 0 20px}
  button{background:#6d92ff;color:#0b1020;border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:600}
  button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div class="box">
  <img src="logo.svg" alt="">
  <h1>Нет интернета · Keine Verbindung</h1>
  <p>Для перевода нужен интернет. Проверьте Wi‑Fi или мобильную сеть.<br>Bitte Internetverbindung prüfen.</p>
  <button autofocus onclick="location.href='https://yai-translator.pages.dev/'">Повторить · Erneut</button>
</div>
</body>
</html>

# Настройки Cloudflare Pages для YAi Translator.
name = "yai-translator"
compatibility_date = "2026-10-30"
pages_build_output_dir = "dist"

# База данных D1: кэш переводов и счётчик дневных запросов.
# Таблицы создаются автоматически при первом запросе (functions/_lib/schema.ts).
[[d1_databases]]
binding = "DB"
database_name = "yai-translator-db"
database_id = "d6240c11-423a-4c33-b1a3-ea829b98e45c"

# Последний запасной провайдер — бесплатные Cloudflare Workers AI.
# ВАЖНО: AI доступен только на сайте Cloudflare, поэтому `npm run dev:api`
# требует однократного входа `npx wrangler login`.
[ai]
binding = "AI"
